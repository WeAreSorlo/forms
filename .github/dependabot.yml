version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A release waits a week before Dependabot offers it
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7's native compiler drops the JavaScript API that tsup builds the type declarations with
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      # Vite, its React plugin and Vitest each need the others' versions, so they come together, whatever the update.
      # A dependency goes in the first group it matches
      vite:
        patterns: [vite, '@vitejs/*', vitest, '@vitest/*']
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
